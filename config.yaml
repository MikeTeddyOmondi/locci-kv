# Locci KV Configuration File
server:
  id: 1
  bind_addr: "127.0.0.1:8080"
  data_dir: "./data"

storage:
  backend: "rocksdb"
  rocksdb:
    max_open_files: 1000
    write_buffer_size: 67108864      # 64MB
    max_write_buffer_number: 3
    target_file_size_base: 67108864  # 64MB
    enable_statistics: true

# Raft configuration
raft:
  heartbeat_tick: 100
  election_tick: 300
  max_size_per_msg: 1048576
  max_inflight_msgs: 256
  check_quorum: true
  pre_vote: true

# Cluster configuration
cluster:
  bootstrap: false
  peers:
    - id: 1
      addr: "127.0.0.1:9001"
    - id: 2
      addr: "127.0.0.1:9002"
    - id: 3
      addr: "127.0.0.1:9003"

logging:
  level: "info"
  format: "json"

