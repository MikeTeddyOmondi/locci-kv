services:
  # Standalone mode (single node, no Raft)
  locci-kv-standalone:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: locci-kv-standalone
    image: locci/kv:latest
    ports:
      - "8080:8080"
    volumes:
      - locci-kv-standalone-data:/app/data
    environment:
      - LOCCI_KV_BIND_ADDR=0.0.0.0:8080
      - LOCCI_KV_DATA_DIR=/app/data
      - LOCCI_KV_LOG_LEVEL=info
    command: ["start"]
    networks:
      - locci-kv-standalone
    profiles:
      - standalone

  # 3-node Raft cluster
  locci-kv-node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: locci-kv-node1
    image: locci/kv:latest
    ports:
      - "8081:8080"
      - "9001:9001"
    volumes:
      - locci-kv-node1-data:/app/data
      - ./configs/node1.yaml:/app/config.yaml:ro
    command: ["--enable-raft", "--config", "/app/config.yaml", "start", "--bootstrap"]
    networks:
      - locci-kv-cluster
    profiles:
      - cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  locci-kv-node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: locci-kv-node2
    image: locci/kv:latest    
    ports:
      - "8082:8080"
      - "9002:9001"
    volumes:
      - locci-kv-node2-data:/app/data
      - ./configs/node2.yaml:/app/config.yaml:ro
    command: ["--enable-raft", "--config", "/app/config.yaml", "start"]
    networks:
      - locci-kv-cluster
    depends_on:
      locci-kv-node1:
        condition: service_healthy
    profiles:
      - cluster

  locci-kv-node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: locci-kv-node3
    image: locci/kv:latest
    ports:
      - "8083:8080"
      - "9003:9001"
    volumes:
      - locci-kv-node3-data:/app/data
      - ./configs/node3.yaml:/app/config.yaml:ro
    command: ["--enable-raft", "--config", "/app/config.yaml", "start"]
    networks:
      - locci-kv-cluster
    depends_on:
      locci-kv-node1:
        condition: service_healthy
    profiles:
      - cluster

networks:
  locci-kv-standalone:
    name: locci-kv-standalone
    driver: bridge
  locci-kv-cluster:
    name: locci-kv-cluster
    driver: bridge

volumes:
  locci-kv-standalone-data:
  locci-kv-node1-data:
  locci-kv-node2-data:
  locci-kv-node3-data:
